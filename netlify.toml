[build]
  command = "npx expo export -p web"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# מפתח AI: Netlify UI → Site settings → Environment variables
# OPENROUTER_API_KEY = ...   (שרת בלבד, בלי EXPO_PUBLIC_)
# AI_ALLOWED_ORIGINS = https://your-site.netlify.app   (אופציונלי)

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/onboard"
  to = "/.netlify/functions/onboard"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
