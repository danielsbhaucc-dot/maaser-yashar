[build]
  command = "npx expo export -p web && node scripts/apply-contact.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# מפתח AI: Netlify UI → Site settings → Environment variables
# OPENROUTER_API_KEY = ...          (שרת בלבד, בלי EXPO_PUBLIC_)
# OPENROUTER_MODEL = meta-llama/... (אופציונלי; ברירת מחדל בשרת)
# AI_ALLOWED_ORIGINS = https://your-site.netlify.app   (אופציונלי)

# /api/chat ו־/api/onboard מוגשים ישירות מהפונקציות (config.path)

# אין באדג' Netlify ב־HTML שלנו. כיבוי תג סטטוס / AI-legible — בדשבורד Netlify
# (Site configuration → General → Status → Status badges / Branding).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Enforcing: חוסם embedding. גופנים מקומיים בלבד (WOFF2 ב־/fonts).
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    # Report-Only — מתאים ל־Expo web (inline + eval במטרו). אחרי redeploy בדקו Console.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# Hashed static assets — long-term immutable cache (T-51)
# Do NOT apply immutable to index.html, sw.js, or manifest
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs for static pages. No SPA catch-all (T-58):
# unknown paths return real 404 + public/404.html.
# App SPA lives at / (index.html). Hashed assets/fonts served as files.
# Tab deep links (T-59) — rewrite to SPA, no catch-all soft-404.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tax"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/guide"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200
