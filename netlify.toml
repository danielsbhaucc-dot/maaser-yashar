[build]
  command = "npx expo export -p web"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# מפתח AI: Netlify UI → Site settings → Environment variables
# OPENROUTER_API_KEY = ...          (שרת בלבד, בלי EXPO_PUBLIC_)
# OPENROUTER_MODEL = meta-llama/... (אופציונלי; ברירת מחדל בשרת)
# AI_ALLOWED_ORIGINS = https://your-site.netlify.app   (אופציונלי)

# /api/chat ו־/api/onboard מוגשים ישירות מהפונקציות (config.path)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'"
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https:; frame-ancestors 'none'"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
