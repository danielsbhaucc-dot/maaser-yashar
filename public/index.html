<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>מעשר ישר</title>
    <meta
      name="description"
      content="פנקס מעשר כספים חינמי, בלי הרשמה. הנתונים נשמרים אצלך."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="מעשר ישר" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link
      rel="preload"
      href="/fonts/heebo-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/heebo-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/heebo-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/rubik-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style id="app-fonts">
      /* שמות תואמים ל-fontFamily בטיפוגרפיה / RN Web */
      @font-face {
        font-family: "Heebo_400Regular";
        src: url("/fonts/heebo-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0590-05FF, U+20AA, U+2013-2014, U+2022;
      }
      @font-face {
        font-family: "Heebo_600SemiBold";
        src: url("/fonts/heebo-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0590-05FF, U+20AA, U+2013-2014, U+2022;
      }
      @font-face {
        font-family: "Heebo_700Bold";
        src: url("/fonts/heebo-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0590-05FF, U+20AA, U+2013-2014, U+2022;
      }
      @font-face {
        font-family: "Rubik_700Bold";
        src: url("/fonts/rubik-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0590-05FF, U+20AA, U+2013-2014, U+2022;
      }
    </style>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0b1020;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>יש להפעיל JavaScript כדי להשתמש במעשר ישר.</noscript>
    <div id="root"></div>
  </body>
</html>
